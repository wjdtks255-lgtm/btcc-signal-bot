name: BTCC Futures Signal Bot

on:
  schedule:
    - cron: '*/5 * * * *'  # 5분 주기로 자동 실행
  workflow_dispatch:     # 수동 실행 버튼 제공

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Execute Signal Script
      env:
        BTCC_TELEGRAM_TOKEN: ${{ secrets.BTCC_TELEGRAM_TOKEN }}
        BTCC_TELEGRAM_CHAT_ID: ${{ secrets.BTCC_TELEGRAM_CHAT_ID }}
      run: |
        python main.py
