name: BTCC Futures Signal Bot

on:
  schedule:
    - cron: '*/5 * * * *'  # 5분마다 실행
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run bot script
        env:
          BTCC_TELEGRAM_TOKEN: ${{ secrets.BTCC_TELEGRAM_TOKEN }}
          BTCC_TELEGRAM_CHAT_ID: ${{ secrets.BTCC_TELEGRAM_CHAT_ID }}
        run: |
          python bot.py
