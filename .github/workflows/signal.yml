name: BTCC Futures Signal Bot

on:
  workflow_dispatch:
  repository_dispatch:
    types: [run-bot]
  schedule:
    - cron: '*/5 * * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Execute Signal Script
        env:
          BTCC_TELEGRAM_TOKEN: ${{ secrets.BTCC_TELEGRAM_TOKEN }}
          BTCC_TELEGRAM_CHAT_ID: ${{ secrets.BTCC_TELEGRAM_CHAT_ID }}
        run: |
          python main.py
